name: Pages

# Builds the landing page and the in-browser demo (scripts/build_site.py) and
# publishes them to GitHub Pages. One-time setup: repo Settings > Pages >
# Source: GitHub Actions. Until then this workflow fails at "Configure Pages";
# the app's own CI and deploy are separate and unaffected.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "app/static/**"
      - "app/tracker.py"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
