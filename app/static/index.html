<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Job Tracker</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"%3E%3Crect width="32" height="32" rx="7" fill="%233A7D7B"/%3E%3Cpath d="M12.5 10.5V8.8c0-.9.7-1.6 1.6-1.6h3.8c.9 0 1.6.7 1.6 1.6v1.7" fill="none" stroke="%23fff" stroke-width="2.2"/%3E%3Crect x="5.5" y="10.5" width="21" height="14.5" rx="2.6" fill="%23fff"/%3E%3Cpath d="M5.5 16.6h21" stroke="%233A7D7B" stroke-width="1.6" opacity=".45"/%3E%3Crect x="13.6" y="14.6" width="4.8" height="4" rx="1.1" fill="%233A7D7B"/%3E%3C/svg%3E'>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/css/list.css">
<link rel="stylesheet" href="/static/css/drawer.css">
<link rel="stylesheet" href="/static/css/prefs.css">
<link rel="stylesheet" href="/static/css/sankey.css">
<script>
  // Apply the saved theme before first paint, so a custom theme doesn't flash
  // the default. js/ui/prefs.js writes these keys; this only replays them.
  try {
    var css = localStorage.getItem("jt-theme-css");
    if (css) { var s = document.createElement("style"); s.id = "jt-theme"; s.textContent = css; document.head.appendChild(s); }
    var mode = JSON.parse(localStorage.getItem("jt-theme") || '"auto"');
    if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
    var attrs = JSON.parse(localStorage.getItem("jt-theme-attrs") || "{}");
    for (var k in attrs) document.documentElement.setAttribute("data-" + k, attrs[k]);
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to applications</a>
<div class="banner" id="demo-banner" hidden>Demo with made-up data. Changes are allowed and reset when the server restarts.</div>

<header class="topbar">
  <div class="topbar-title">
    <h1 id="title">Job search</h1>
    <div class="topbar-sub" id="sub"><span class="live" id="live"><i aria-hidden="true"></i><span>Loading…</span></span></div>
  </div>
  <div class="topbar-search">
    <svg class="ico" aria-hidden="true" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input id="q" class="input" type="search" placeholder="Search company, role, notes" aria-label="Search all applications" autocomplete="off">
    <kbd class="kbd" aria-hidden="true">/</kbd>
  </div>
  <div class="topbar-actions">
    <button class="btn primary" id="new-btn" type="button" title="New application (N)">
      <svg class="ico" aria-hidden="true" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg><span>New</span>
    </button>
    <button class="btn ghost" id="flow-btn" type="button" title="Flow chart (F)">
      <svg class="ico" aria-hidden="true" viewBox="0 0 16 16"><path d="M2 3.5h3c3 0 3 4.5 6 4.5h3M2 12.5h3c3 0 3-4.5 6-4.5"/><path d="M2 8h12"/></svg><span>Flow</span>
    </button>
    <button class="btn icon ghost" id="mode-btn" type="button" aria-label="Color mode: auto" title="Color mode"></button>
    <button class="btn icon ghost" id="prefs-btn" type="button" aria-label="Appearance settings" title="Appearance (,)">
      <svg class="ico" aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
    </button>
    <button class="btn icon ghost" id="help-btn" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button>
  </div>
</header>

<div class="layout">
  <main id="main" tabindex="-1" aria-label="Applications"></main>
  <aside id="rail" aria-label="Today and recent changes"></aside>
</div>

<aside id="drawer" class="drawer" aria-label="Application details" hidden></aside>

<script type="module" src="/static/app.js"></script>
</body>
</html>
